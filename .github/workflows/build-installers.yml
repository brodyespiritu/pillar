name: build-installers

# Builds native installers on real Windows + macOS machines and attaches
# them to a GitHub Release. Run manually from the Actions tab, or push a
# tag like "pillar-v1.0.0".
on:
  workflow_dispatch:
  push:
    tags: ['pillar-v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal .dmg (Apple Silicon + Intel)
            args: '--target universal-apple-darwin'
          - platform: windows-latest     # .msi + .exe
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      # ── macOS desktop widget (WidgetKit appex) ──
      # Built before tauri-action, embedded via bundle.macOS.files. Signed with
      # the Developer ID cert when the APPLE_* secrets exist; ad-hoc otherwise
      # (an ad-hoc widget may not register with macOS — it becomes fully
      # functional once real signing is configured).
      - name: Build widget extension (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          brew install xcodegen jq
          cd src-tauri/widget
          xcodegen generate
          xcodebuild -project PillarWidget.xcodeproj -scheme PillarWidgetExtension \
            -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APPEX="build/Build/Products/Release/PillarWidget.appex"
          if [ -n "$APPLE_CERTIFICATE" ]; then
            KC=widget.keychain-db; KCPASS=$(uuidgen)
            echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
            security create-keychain -p "$KCPASS" "$KC"
            security unlock-keychain -p "$KCPASS" "$KC"
            security import cert.p12 -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" login.keychain-db
            codesign --force --options runtime --timestamp --keychain "$KC" \
              --sign "$APPLE_SIGNING_IDENTITY" "$APPEX"
            rm -f cert.p12
            echo "Widget signed with Developer ID."
          else
            codesign --force --sign - "$APPEX"
            echo "No signing secrets — widget ad-hoc signed."
          fi
          mkdir -p dist && rm -rf dist/PillarWidget.appex && cp -R "$APPEX" dist/
          cd ..
          jq '.bundle.macOS //= {} | .bundle.macOS.files = {"PlugIns/PillarWidget.appex": "widget/dist/PillarWidget.appex"}' \
            tauri.conf.json > tauri.conf.patched.json
          mv tauri.conf.patched.json tauri.conf.json
          echo "Widget embedded into bundle config."

      - name: Build app + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization. Only used on the macOS runner;
          # these are empty on Windows and safely ignored. When the secrets are
          # absent the macOS build is simply produced unsigned (as before).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          tagName: pillar-v__VERSION__
          releaseName: 'Pillar v__VERSION__'
          releaseBody: 'Download the installer for your platform — Windows (.msi or .exe) or macOS (.dmg).'
          releaseDraft: false
          args: ${{ matrix.args }}
